<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ASOC - Join Game</title>
  <link rel="stylesheet" href="css/asoc.css">
  <style>
    #join-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2vh 4vw;
      text-align: center;
      background: #0a0c10;
    }

    .join-logo {
      font-size: clamp(2rem, 8vw, 4rem);
      font-weight: 300;
      color: var(--accent-silver);
      letter-spacing: 8px;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    .join-subtitle {
      font-size: clamp(0.8rem, 2vw, 1.2rem);
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 4px;
      margin-bottom: 3rem;
    }

    .join-form {
      width: 100%;
      max-width: 400px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
    }

    .form-group {
      margin-bottom: 1.5rem;
      text-align: left;
    }

    .form-label {
      display: block;
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--accent-gold);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 0.5rem;
    }

    .form-input {
      width: 100%;
      background: var(--button-bg);
      border: 1px solid var(--button-border);
      border-radius: 6px;
      padding: 14px 16px;
      color: var(--text-primary);
      font-size: clamp(1rem, 3vw, 1.3rem);
      text-transform: uppercase;
      letter-spacing: 4px;
      text-align: center;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .form-input::placeholder {
      color: var(--text-dim);
      letter-spacing: 2px;
    }

    .form-input:focus {
      border-color: var(--accent-gold);
      box-shadow: 0 0 0 2px rgba(212, 168, 67, 0.2);
    }

    .form-input.error {
      border-color: #c86a6a;
    }

    .join-btn {
      width: 100%;
      background: linear-gradient(135deg, rgba(212, 168, 67, 0.2), rgba(25, 28, 35, 0.9));
      border: 1px solid var(--accent-gold);
      border-radius: 6px;
      padding: 16px;
      color: var(--accent-gold);
      font-size: clamp(0.9rem, 2.5vw, 1.1rem);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .join-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, rgba(212, 168, 67, 0.35), rgba(40, 45, 55, 0.95));
    }

    .join-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .join-btn:focus-visible {
      outline: 2px solid var(--accent-gold);
      outline-offset: 2px;
    }

    .error-message {
      display: none;
      color: #e8a0a0;
      font-size: 0.8rem;
      margin-top: 1rem;
      text-align: center;
      min-height: 1.2rem;
    }

    .error-message.visible {
      display: block;
    }

    #game-screen {
      display: none;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background: #0a0c10;
    }

    #game-screen.active {
      display: flex;
    }

    /* Scoped to the board frame ONLY -- this is the "game/play area"
       background, never the application shell. #public-board's own
       innerHTML is fully replaced on every render (see player.js
       renderBoard()), so the background layer lives in the stable
       .public-board-frame wrapper instead, sized to that frame's exact
       bounds and clipped by its overflow:hidden below. The app shell
       around it (#game-screen) stays neutral gunmetal regardless. */
    #background-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.55;
      filter: brightness(0.7) contrast(1.1);
      transition: opacity 0.5s ease, filter 0.5s ease;
      z-index: 0;
    }

    #board-layer {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2vh 2vw;
      min-width: 0;
      z-index: 1;
    }

    /* LOCKED geometry rule: the board is canonically 1900x1267 and that
       ratio is sacred everywhere it's shown -- it may scale uniformly but
       must never stretch independently on X or Y. Same two-box split as
       index.html's #public-view (see that file's css/asoc.css comment for
       the full "why" -- flex-grow + an explicit width together make
       aspect-ratio get ignored, since both axes end up independently
       definite), plus one more wrapper here specifically:

         .public-board-frame -- the AVAILABLE SPACE inside #board-layer.
           No ratio of its own; just whatever room is left after the
           trackers/header above it.
         .public-board-ratio -- the actual RATIO-LOCKED box. Absolutely
           positioned, inset:0 + margin:auto, NO explicit width/height --
           only aspect-ratio + max-width/max-height:100%, so the browser
           computes the largest 1900:1267 rect that fits the frame and
           centers it (letterboxing, never distortion).
         #background-layer + #public-board both live INSIDE
           .public-board-ratio, as siblings, so they share the exact same
           canonical rectangle. They stay siblings of each other (not
           nested) because player.js's renderBoard() fully replaces
           #public-board's innerHTML on every reveal/hide -- nesting the
           persistent background <img> inside it would reload/flicker it
           on every single render.

       Previously .public-board itself carried the aspect-ratio AND (via
       player.js) had the .public-header title/theme text injected inside
       its own innerHTML -- the header now renders into the separate
       #public-header-bar sibling above this frame instead. */
    .public-board-frame {
      position: relative;
      width: 100%;
      max-width: var(--canvas-width);
      flex: 1 1 auto;
      min-height: 0;
      min-width: 0;
    }

    .public-board-ratio {
      position: absolute;
      inset: 0;
      margin: auto;
      aspect-ratio: var(--board-aspect);
      max-width: 100%;
      max-height: 100%;
      overflow: hidden;
      border-radius: 8px;
    }

    .public-board {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
    }

    .public-board .asoc-board {
      width: 100%;
      height: 100%;
    }

    .public-header {
      text-align: center;
      margin-bottom: 16px;
      padding: 0 20px;
      flex-shrink: 0;
    }

    .public-title {
      font-size: clamp(1.2rem, 3vw, 2rem);
      font-weight: 300;
      color: var(--accent-silver);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .public-theme {
      font-size: clamp(0.7rem, 1.5vw, 1rem);
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .difficulty-badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .public-difficulty {
      margin-top: 8px;
    }

    .diff-green  { background: rgba(46, 204, 113, 0.18); color: #2ecc71; border: 1px solid rgba(46,204,113,0.35); }
    .diff-yellow { background: rgba(241, 196, 15, 0.18); color: #f1c40f; border: 1px solid rgba(241,196,15,0.35); }
    .diff-amber  { background: rgba(230, 126, 34, 0.18); color: #e67e22; border: 1px solid rgba(230,126,34,0.35); }
    .diff-red    { background: rgba(231, 76, 60, 0.18); color: #e74c3c; border: 1px solid rgba(231,76,60,0.35); }
    .diff-purple { background: rgba(155, 89, 182, 0.18); color: #9b59b6; border: 1px solid rgba(155,89,182,0.35); }
    .diff-black  { background: rgba(26, 26, 46, 0.45); color: #8080a0; border: 1px solid rgba(80,80,100,0.5); }

    #chat-panel {
      width: 100%;
      max-width: var(--canvas-width);
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 12px;
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      max-height: 35vh;
      flex-shrink: 0;
    }

    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--panel-border);
    }

    .chat-title {
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--accent-gold);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .chat-solved {
      font-size: 0.55rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px;
      margin-bottom: 8px;
      min-height: 0;
    }

    .chat-message {
      background: var(--button-bg);
      border: 1px solid var(--button-border);
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 8px;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .chat-message-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .chat-player-name {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--accent-silver);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .chat-message.own .chat-player-name {
      color: var(--accent-gold);
    }

    .chat-time {
      font-size: 0.55rem;
      color: var(--text-dim);
    }

    .chat-message-text {
      font-size: 0.85rem;
      color: var(--text-primary);
      word-wrap: break-word;
      line-height: 1.4;
    }

    /* Verdict-state text treatment: presentation only, driven by the
       authoritative msg.verdict already on the message element -- no
       extra state is introduced. Green = accepted, muted red + faint
       strike = rejected. Unjudged messages are untouched above. */
    .chat-message.wrong .chat-message-text {
      color: #b5544a;
      text-decoration: line-through;
      text-decoration-color: rgba(231, 76, 60, 0.4);
      text-decoration-thickness: 1px;
    }

    .chat-message.correct .chat-message-text {
      color: #5cb87a;
    }

    .chat-verdict {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      font-size: 1rem;
      margin-top: 6px;
    }

    .chat-verdict.wrong {
      background: rgba(231, 76, 60, 0.2);
      border: 1px solid #e74c3c;
    }

    .chat-verdict.correct {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid #1a1a2e;
    }

    .chat-target {
      font-size: 0.55rem;
      color: var(--accent-gold);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
    }

    /* SHADOW BROKER transmission bubble styling (.shadow-broker-transmission
       and friends, incl. the .sb-glitch-in arrival animation) now lives in
       css/asoc.css, shared with index.html -- the GM console renders the
       exact same markup/styling now (see Skeleton.shadowBrokerTransmissionHTML
       in js/skeleton.js), so it's defined in exactly one place. */

    .chat-form {
      display: flex;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--panel-border);
    }

    #chat-input {
      flex: 1;
      background: var(--button-bg);
      border: 1px solid var(--button-border);
      border-radius: 6px;
      padding: 12px 14px;
      color: var(--text-primary);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s ease;
    }

    #chat-input::placeholder {
      color: var(--text-dim);
    }

    #chat-input:focus {
      border-color: var(--accent-gold);
    }

    .chat-send-btn {
      background: linear-gradient(135deg, rgba(212, 168, 67, 0.2), rgba(25, 28, 35, 0.9));
      border: 1px solid var(--accent-gold);
      border-radius: 6px;
      padding: 12px 20px;
      color: var(--accent-gold);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .chat-send-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, rgba(212, 168, 67, 0.35), rgba(40, 45, 55, 0.95));
    }

    .chat-send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .connection-status {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      font-size: 0.7rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      z-index: 10;
      backdrop-filter: blur(4px);
    }

    .connection-status.connected .status-dot {
      background: #2ecc71;
      box-shadow: 0 0 8px #2ecc71;
    }

    .connection-status.disconnected .status-dot {
      background: #e74c3c;
      box-shadow: 0 0 8px #e74c3c;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      transition: all 0.2s ease;
    }

    .reconnecting {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 12, 16, 0.95);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .reconnecting.active {
      display: flex;
    }

    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid var(--panel-border);
      border-top-color: var(--accent-gold);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 480px) {
      .join-form {
        padding: 1.5rem 1.2rem;
      }
      .form-input {
        padding: 12px 14px;
        font-size: 1.1rem;
      }
      .chat-form {
        flex-direction: column;
      }
      .chat-send-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div id="join-screen">
    <div class="join-logo">ASOC</div>
    <div class="join-subtitle">Join Game</div>

    <form class="join-form" id="join-form">
      <div class="form-group">
        <label class="form-label" for="room-code">Room Code</label>
        <input type="text" class="form-input" id="room-code" placeholder="K7RX" maxlength="4" autocomplete="off" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="player-name">Name</label>
        <input type="text" class="form-input" id="player-name" placeholder="Your Name" maxlength="20" autocomplete="off" required>
      </div>
      <button type="submit" class="join-btn" id="join-btn">JOIN GAME</button>
      <div class="error-message" id="error-message"></div>
    </form>
  </div>

  <div id="game-screen">
    <div id="board-layer">
      <div class="timer-tracker" id="timer-tracker-player"></div>
      <div class="womf-tracker" id="womf-tracker-player"></div>
      <!-- Title/theme/difficulty badge live OUTSIDE the sacred 1900x1267
           board frame -- see .public-board-frame's comment below.
           Populated by PlayerApp.renderBoard(). -->
      <div class="public-header" id="public-header-bar"></div>
      <div id="public-board-frame" class="public-board-frame">
        <div class="public-board-ratio">
          <img id="background-layer" alt="Game background">
          <div id="public-board" class="public-board"></div>
        </div>
      </div>
    </div>

    <!-- Read-only Wheel of Misfortune -- no ROLL/CLOSE controls are ever
         drawn here (Wheel.update is always called with isGM=false), it
         only reflects whatever the GM's copy is doing. -->
    <div id="wheel-overlay" class="wheel-overlay"></div>
    <div id="player-leaderboard-strip" class="player-leaderboard-strip" style="display: none;">
      <div id="player-leaderboard-list" class="player-leaderboard-list"></div>
      <button type="button" id="player-alltime-toggle-btn" class="player-alltime-toggle-btn">ALL-TIME</button>
    </div>
    <div id="player-alltime-panel" class="player-alltime-panel" style="display: none;"></div>

    <div id="chat-panel">
      <div class="chat-header">
        <span class="chat-title">GUESSES</span>
        <span class="chat-solved" id="chat-solved-count">SOLVED: 0/5</span>
      </div>
      <div id="chat-messages"></div>
      <form class="chat-form" id="chat-form">
        <input type="text" id="chat-input" placeholder="Type your guess..." maxlength="100" autocomplete="off">
        <button type="submit" class="chat-send-btn">SEND</button>
      </form>
    </div>
    <div class="connection-status" id="connection-status">
      <span class="status-dot"></span>
      <span class="status-text">CONNECTING</span>
    </div>
    <div class="reconnecting" id="reconnecting-overlay">
      <div class="loading-spinner"></div>
      <div>RECONNECTING</div>
    </div>
  </div>

  <div id="score-announcement-layer"></div>

  <script src="js/skeleton.js"></script>
  <script src="js/womf.js"></script>
  <script src="js/wheel.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/game-data.js"></script>
  <script src="js/board.js"></script>
  <script src="js/player.js"></script>
</body>
</html>
