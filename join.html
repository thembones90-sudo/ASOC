<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ASOC - Join Game</title>
  <link rel="stylesheet" href="css/asoc.css">
  <style>
    #join-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2vh 4vw;
      text-align: center;
      background: #0a0c10;
    }

    .join-logo {
      font-family: var(--font-system);
      font-size: clamp(2.8rem, 8vw, 4.8rem);
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 0.65rem;
      background: linear-gradient(180deg, #eef1f7 0%, #a4aab7 55%, #737a88 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 12px rgba(184, 188, 200, 0.08);
    }

    .join-subtitle {
      font-family: var(--font-system);
      font-size: clamp(0.82rem, 2vw, 1.12rem);
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 1.6rem;
    }

    .join-form {
      width: 100%;
      max-width: 400px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      padding: 2.5rem 2rem;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
    }

    .form-group {
      margin-bottom: 1.5rem;
      text-align: left;
    }

    .form-label {
      display: block;
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--accent-gold);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 0.5rem;
    }

    .form-input {
      width: 100%;
      background: var(--button-bg);
      border: 1px solid var(--button-border);
      border-radius: 6px;
      padding: 14px 16px;
      color: var(--text-primary);
      font-size: clamp(1rem, 3vw, 1.3rem);
      text-transform: uppercase;
      letter-spacing: 4px;
      text-align: center;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    #room-code {
      font-family: var(--font-machine);
      font-variant-numeric: tabular-nums;
    }

    .form-input::placeholder {
      color: var(--text-dim);
      letter-spacing: 2px;
    }

    .form-input:focus {
      border-color: var(--accent-gold);
      box-shadow: 0 0 0 2px rgba(212, 168, 67, 0.2);
    }

    .form-input.error {
      border-color: #c86a6a;
    }

    .little-hero-appearance {
      display: grid;
      grid-template-columns: 112px 1fr;
      gap: 16px;
      align-items: center;
      margin: 0 0 1.5rem;
      padding: 14px;
      background: rgba(8, 10, 14, 0.7);
      border: 1px solid var(--button-border);
      border-radius: 8px;
      text-align: left;
    }

    .little-hero-avatar-upload {
      display: block;
      cursor: pointer;
      text-align: center;
    }

    .little-hero-avatar-preview {
      --lh-frame: #9B5DE0;
      width: 92px;
      height: 92px;
      margin: 0 auto 7px;
      border-radius: 50%;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 35%, #30343d, #0b0d11 72%);
      border: 4px solid var(--lh-frame);
      box-shadow:
        inset 0 0 0 2px rgba(225, 229, 238, 0.5),
        0 0 16px color-mix(in srgb, var(--lh-frame) 62%, transparent);
    }

    .little-hero-avatar-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .little-hero-avatar-preview.has-image img {
      display: block;
    }

    .little-hero-avatar-preview.has-image .little-hero-avatar-placeholder {
      display: none;
    }

    .little-hero-avatar-placeholder {
      color: #d8dbe2;
      font-family: var(--font-system);
      font-weight: 700;
      font-size: 1.25rem;
      letter-spacing: 0.12em;
    }

    .little-hero-upload-label {
      color: var(--text-dim);
      font-size: 0.58rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #little-hero-avatar-file {
      display: none;
    }

    .little-hero-frame-controls {
      min-width: 0;
    }

    .little-hero-frame-row {
      display: grid;
      grid-template-columns: 48px 1fr;
      gap: 8px;
      align-items: center;
      margin-top: 7px;
    }

    #little-hero-frame-picker {
      width: 48px;
      height: 42px;
      padding: 2px;
      border: 1px solid var(--button-border);
      border-radius: 5px;
      background: #11141a;
      cursor: pointer;
    }

    #little-hero-frame-hex {
      width: 100%;
      min-width: 0;
      padding: 11px 10px;
      border: 1px solid var(--button-border);
      border-radius: 5px;
      background: var(--button-bg);
      color: var(--text-primary);
      font: 700 0.88rem var(--font-machine);
      text-transform: uppercase;
      letter-spacing: 1px;
      outline: none;
    }

    #little-hero-frame-hex:focus {
      border-color: var(--lh-frame, #9B5DE0);
    }

    .little-hero-chaos-note {
      margin-top: 8px;
      color: var(--text-dim);
      font-size: 0.52rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      line-height: 1.35;
    }

    .join-btn {
      width: 100%;
      background: linear-gradient(135deg, rgba(212, 168, 67, 0.2), rgba(25, 28, 35, 0.9));
      border: 1px solid var(--accent-gold);
      border-radius: 6px;
      padding: 16px;
      color: var(--accent-gold);
      font-size: clamp(0.9rem, 2.5vw, 1.1rem);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .join-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, rgba(212, 168, 67, 0.35), rgba(40, 45, 55, 0.95));
    }

    .join-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .join-btn:focus-visible {
      outline: 2px solid var(--accent-gold);
      outline-offset: 2px;
    }

    .error-message {
      display: none;
      color: #e8a0a0;
      font-size: 0.8rem;
      margin-top: 1rem;
      text-align: center;
      min-height: 1.2rem;
    }

    .error-message.visible {
      display: block;
    }

    #game-screen {
      display: none;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      background: #0a0c10;
    }

    #game-screen.active {
      display: flex;
    }

    .player-battle-layout {
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(360px, 2fr);
      gap: 14px;
      width: 100%;
      height: 100%;
      min-height: 0;
      padding: 12px;
      box-sizing: border-box;
    }

    .battle-comms-lobby {
      display: flex;
      flex-direction: column;
      min-width: 0;
      min-height: 0;
      border-left: 1px solid rgba(116,126,139,.28);
      padding-left: 12px;
    }

    /* Scoped to the board frame ONLY -- this is the "game/play area"
       background, never the application shell. #public-board's own
       innerHTML is fully replaced on every render (see player.js
       renderBoard()), so the background layer lives in the stable
       .public-board-frame wrapper instead, sized to that frame's exact
       bounds and clipped by its overflow:hidden below. The app shell
       around it (#game-screen) stays neutral gunmetal regardless. */
    #background-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0.55;
      filter: brightness(0.7) contrast(1.1);
      transition: opacity 0.5s ease, filter 0.5s ease;
      z-index: 0;
    }

    #board-layer {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1vh 1vw;
      min-width: 0;
      min-height: 0;
      z-index: 1;
    }

    /* LOCKED geometry rule: the board is canonically 1900x1267 and that
       ratio is sacred everywhere it's shown -- it may scale uniformly but
       must never stretch independently on X or Y. Same two-box split as
       index.html's #public-view (see that file's css/asoc.css comment for
       the full "why" -- flex-grow + an explicit width together make
       aspect-ratio get ignored, since both axes end up independently
       definite), plus one more wrapper here specifically:

         .public-board-frame -- the AVAILABLE SPACE inside #board-layer.
           No ratio of its own; just whatever room is left after the
           trackers/header above it.
         .public-board-ratio -- the actual RATIO-LOCKED box. Absolutely
           positioned, inset:0 + margin:auto, NO explicit width/height --
           only aspect-ratio + max-width/max-height:100%, so the browser
           computes the largest 1900:1267 rect that fits the frame and
           centers it (letterboxing, never distortion).
         #background-layer + #public-board both live INSIDE
           .public-board-ratio, as siblings, so they share the exact same
           canonical rectangle. They stay siblings of each other (not
           nested) because player.js's renderBoard() fully replaces
           #public-board's innerHTML on every reveal/hide -- nesting the
           persistent background <img> inside it would reload/flicker it
           on every single render.

       Previously .public-board itself carried the aspect-ratio AND (via
       player.js) had the .public-header title/theme text injected inside
       its own innerHTML -- the header now renders into the separate
       #public-header-bar sibling above this frame instead. */
    .public-board-frame {
      position: relative;
      width: 100%;
      max-width: var(--canvas-width);
      aspect-ratio: var(--board-aspect);
      flex: 0 0 auto;
      min-width: 0;
    }

    .public-board-ratio {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 8px;
    }

    .public-board {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
    }

    .public-board .asoc-board {
      width: 100%;
      height: 100%;
    }

    .public-header {
      text-align: center;
      margin-bottom: 16px;
      padding: 0 20px;
      flex-shrink: 0;
    }

    .public-title {
      font-size: clamp(1.2rem, 3vw, 2rem);
      font-weight: 300;
      color: var(--accent-silver);
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 4px;
    }

    .public-theme {
      font-size: clamp(0.7rem, 1.5vw, 1rem);
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .difficulty-badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .public-difficulty {
      margin-top: 8px;
    }

    .diff-green  { background: rgba(46, 204, 113, 0.18); color: #2ecc71; border: 1px solid rgba(46,204,113,0.35); }
    .diff-yellow { background: rgba(241, 196, 15, 0.18); color: #f1c40f; border: 1px solid rgba(241,196,15,0.35); }
    .diff-amber  { background: rgba(230, 126, 34, 0.18); color: #e67e22; border: 1px solid rgba(230,126,34,0.35); }
    .diff-red    { background: rgba(231, 76, 60, 0.18); color: #e74c3c; border: 1px solid rgba(231,76,60,0.35); }
    .diff-purple { background: rgba(155, 89, 182, 0.18); color: #9b59b6; border: 1px solid rgba(155,89,182,0.35); }
    .diff-black  { background: rgba(26, 26, 46, 0.45); color: #8080a0; border: 1px solid rgba(80,80,100,0.5); }

    .battle-comms-lobby .player-leaderboard-strip {
      flex: 0 0 auto;
      border: 1px solid rgba(116,126,139,.38);
      margin-bottom: 8px;
    }

    #chat-panel {
      width: 100%;
      max-width: var(--canvas-width);
      background:
        linear-gradient(180deg, rgba(19, 23, 29, 0.98), rgba(7, 9, 12, 0.98));
      border: 1px solid rgba(116, 126, 139, 0.55);
      border-radius: 3px;
      padding: 0;
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      max-height: none;
      min-height: 0;
      flex: 1 1 auto;
      box-shadow:
        inset 0 1px rgba(255,255,255,0.035),
        inset 0 0 28px rgba(0,0,0,0.55),
        0 10px 28px rgba(0,0,0,0.28);
      position: relative;
      overflow: hidden;
    }

    #chat-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(255,255,255,0.012) 0,
        rgba(255,255,255,0.012) 1px,
        transparent 1px,
        transparent 4px
      );
      z-index: 0;
    }

    #chat-panel > * { position: relative; z-index: 1; }

    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 11px 14px 10px;
      margin: 0;
      background: linear-gradient(90deg, rgba(38,43,51,.9), rgba(12,15,19,.92));
      border-bottom: 1px solid rgba(116,126,139,.42);
      box-shadow: inset 0 -1px rgba(0,0,0,.55);
    }

    .battle-comms-heading, .battle-comms-status { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .battle-comms-status { justify-content: flex-end; }
    .battle-comms-room, .battle-comms-online { font-size: .55rem; text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; }
    .battle-comms-room { color: #7f8792; padding-left: 12px; border-left: 1px solid rgba(116,126,139,.4); }
    .battle-comms-online { color: #62b77c; }

    .chat-title {
      font-size: 0.65rem;
      font-weight: 600;
      color: var(--accent-gold);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .chat-solved {
      font-size: 0.55rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 4px 8px;
      margin-bottom: 8px;
      min-height: 0;
    }

    .chat-message {
      background: var(--button-bg);
      border: 1px solid var(--button-border);
      border-radius: 2px;
      padding: 9px 11px;
      margin-bottom: 7px;
      border-left: 2px solid var(--little-hero-accent, rgba(130,140,154,.55));
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .chat-message-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .chat-player-name {
      font-size: 0.74rem;
      font-weight: 700;
      color: #eef0f5;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .chat-message.own .chat-player-name {
      color: var(--accent-gold);
    }

    .chat-time {
      font-family: var(--font-machine);
      font-size: 0.55rem;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
    }

    .chat-message-text {
      font-family: var(--font-human);
      font-size: 0.85rem;
      color: var(--text-primary);
      word-wrap: break-word;
      line-height: 1.4;
    }

    /* Verdict-state text treatment: presentation only, driven by the
       authoritative msg.verdict already on the message element -- no
       extra state is introduced. Green = accepted, muted red + faint
       strike = rejected. Unjudged messages are untouched above. */
    .chat-message.wrong .chat-message-text {
      color: #d86157;
      text-decoration: line-through;
      text-decoration-color: rgba(255, 72, 72, 0.9);
      text-decoration-thickness: 2px;
    }

    .chat-message.correct .chat-message-text {
      color: #5cb87a;
    }

    .chat-verdict {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 4px;
      font-size: 1rem;
      margin-top: 6px;
    }

    .chat-verdict.wrong {
      background: rgba(231, 76, 60, 0.2);
      border: 1px solid #e74c3c;
    }

    .chat-verdict.correct {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid #1a1a2e;
    }

    .chat-target {
      font-size: 0.55rem;
      color: var(--accent-gold);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 4px;
    }

    /* SHADOW BROKER transmission bubble styling (.shadow-broker-transmission
       and friends, incl. the .sb-glitch-in arrival animation) now lives in
       css/asoc.css, shared with index.html -- the GM console renders the
       exact same markup/styling now (see Skeleton.shadowBrokerTransmissionHTML
       in js/skeleton.js), so it's defined in exactly one place. */

    .chat-form {
      display: flex;
      gap: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--panel-border);
    }

    #chat-input {
      flex: 1;
      font-family: var(--font-human);
      background: var(--button-bg);
      border: 1px solid var(--button-border);
      border-radius: 6px;
      padding: 12px 14px;
      color: var(--text-primary);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s ease;
    }

    #chat-input::placeholder {
      color: var(--text-dim);
    }

    #chat-input:focus {
      border-color: var(--accent-gold);
    }

    .chat-send-btn {
      background: linear-gradient(135deg, rgba(212, 168, 67, 0.2), rgba(25, 28, 35, 0.9));
      border: 1px solid var(--accent-gold);
      border-radius: 6px;
      padding: 12px 20px;
      color: var(--accent-gold);
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .chat-send-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, rgba(212, 168, 67, 0.35), rgba(40, 45, 55, 0.95));
    }

    .chat-send-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }


    .little-hero-hud, .little-hero-roster { width:100%; max-width:none; box-sizing:border-box; }
    .little-hero-hud { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-top:10px; padding:9px 12px; background:linear-gradient(90deg,rgba(19,23,29,.98),rgba(7,9,12,.98)); border:1px solid rgba(116,126,139,.48); box-shadow:inset 0 1px rgba(255,255,255,.035); }
    .hero-hud-identity { display:flex; align-items:center; gap:9px; min-width:0; font:700 .72rem var(--font-machine); letter-spacing:1px; text-transform:uppercase; }
    .hero-hud-identity .little-hero-avatar { width:34px; height:34px; flex:0 0 34px; }
    .hero-hud-stats { display:flex; align-items:center; justify-content:flex-end; gap:14px; flex-wrap:wrap; color:#7f8792; font:600 .56rem var(--font-machine); letter-spacing:1px; }
    .hero-hud-stats b { color:#eef0f5; margin-left:4px; }
    .hero-hud-link { color:#d6a843; }
    .hero-hud-link.stable { color:#62b77c; }
    .hero-hud-link.lost { color:#d86157; }
    .hero-hud-score-bump { animation:hudScoreBump .55s ease; }
    @keyframes hudScoreBump { 40%{color:#62b77c;text-shadow:0 0 12px rgba(98,183,124,.8);transform:scale(1.2)} }
    .little-hero-roster { display:flex; gap:6px; overflow-x:auto; padding:7px 2px 2px; scrollbar-width:thin; }
    .hero-roster-card { display:flex; align-items:center; gap:6px; flex:0 0 auto; padding:5px 8px; border:1px solid rgba(116,126,139,.34); background:rgba(10,12,16,.82); font:600 .56rem var(--font-machine); letter-spacing:.7px; text-transform:uppercase; }
    .hero-roster-card .little-hero-avatar { width:24px; height:24px; }
    .hero-roster-card b { color:#d6a843; }
    .hero-roster-card.signal-lost { opacity:.38; filter:grayscale(1); }
    .battle-event-feed { display:flex; flex-direction:column; gap:3px; padding:5px 10px 0; }
    .battle-event { text-align:center; padding:5px 8px; border-top:1px solid rgba(116,126,139,.25); border-bottom:1px solid rgba(116,126,139,.25); color:#8e98a6; font:600 .55rem var(--font-machine); letter-spacing:1.2px; text-transform:uppercase; animation:eventIn .25s ease; }
    @keyframes eventIn { from{opacity:0;transform:translateY(-4px)} }
    .chat-message.correct { animation:confirmPulse .45s ease; }
    .chat-message.wrong { animation:rejectTwitch .38s ease; }
    @keyframes confirmPulse { 45%{box-shadow:inset 0 0 20px rgba(92,184,122,.18);border-color:rgba(92,184,122,.75)} }
    @keyframes rejectTwitch { 25%{transform:translateX(-2px)} 50%{transform:translateX(2px)} 75%{transform:translateX(-1px)} }
    #chat-panel.broker-priority .chat-message { opacity:.35; transition:opacity .2s ease; }
    #chat-panel.broker-priority .shadow-broker-transmission { opacity:1; }
    .chat-message.grouped { margin-top:-7px; border-top-color:transparent; }
    .chat-message.grouped .chat-message-header { display:none; }
    .chat-reply-preview { flex:1 0 100%; padding:5px 8px; border-left:2px solid #d6a843; background:rgba(212,168,67,.07); color:#aab0ba; font-size:.62rem; }
    .chat-reply-btn { float:right; border:0; background:transparent; color:#7f8792; cursor:pointer; font-size:.55rem; text-transform:uppercase; }
    .chat-reply-btn:hover { color:#d6a843; }
    .phase-borrowed #chat-panel, .phase-borrowed .little-hero-hud { animation:borrowedTerminal 1.2s ease-in-out infinite alternate; }
    @keyframes borrowedTerminal { to{border-color:rgba(214,168,67,.72);box-shadow:inset 0 0 18px rgba(214,168,67,.07)} }
    .phase-final .chat-title::after { content:" // FINAL PHASE"; color:#d86157; }

    .connection-status {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      font-size: 0.7rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
      z-index: 10;
      backdrop-filter: blur(4px);
    }

    .connection-status.connected .status-dot {
      background: #2ecc71;
      box-shadow: 0 0 8px #2ecc71;
    }

    .connection-status.disconnected .status-dot {
      background: #e74c3c;
      box-shadow: 0 0 8px #e74c3c;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      transition: all 0.2s ease;
    }

    .reconnecting {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(10, 12, 16, 0.95);
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .reconnecting.active {
      display: flex;
    }

    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 3px solid var(--panel-border);
      border-top-color: var(--accent-gold);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 900px) {
      #game-screen { overflow-y:auto; }
      .player-battle-layout { display:flex; flex-direction:column; height:auto; min-height:100%; padding:8px; }
      #board-layer { min-height:70vh; }
      .battle-comms-lobby { min-height:48vh; border-left:0; border-top:1px solid rgba(116,126,139,.28); padding:10px 0 0; }
      #chat-panel { min-height:38vh; }
    }

    @media (max-width: 480px) {
      .join-form {
        padding: 1.5rem 1.2rem;
      }
      .form-input {
        padding: 12px 14px;
        font-size: 1.1rem;
      }
      #game-screen { padding-left:max(8px, env(safe-area-inset-left)); padding-right:max(8px, env(safe-area-inset-right)); padding-bottom:max(74px, env(safe-area-inset-bottom)); overflow-x:hidden; }
      .little-hero-hud { align-items:flex-start; flex-direction:column; gap:7px; }
      .hero-hud-stats { width:100%; justify-content:space-between; gap:6px; }
      .battle-comms-online { display:none; }
      .chat-header { gap:8px; padding:9px 10px; }
      .chat-form { flex-direction:row; flex-wrap:wrap; padding:8px; }
      #chat-input { min-width:0; padding:12px 10px; }
      .chat-send-btn { width:auto; min-width:92px; padding:12px 10px; }
      #chat-panel { max-height:48vh; }
      .connection-status { bottom:max(10px, env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>
  <div id="join-screen">
    <div class="join-logo">ASOC</div>
    <div class="join-subtitle">Little Hero // Battle Access</div>

    <form class="join-form" id="join-form">
      <div class="form-group">
        <label class="form-label" for="room-code">Room Code</label>
        <input type="text" class="form-input" id="room-code" placeholder="K7RX" maxlength="4" autocomplete="off" required>
      </div>
      <div class="form-group">
        <label class="form-label" for="player-name">Little Hero Designation</label>
        <input type="text" class="form-input" id="player-name" placeholder="USERNAME" maxlength="20" autocomplete="off" required>
      </div>

      <div class="little-hero-appearance">
        <label class="little-hero-avatar-upload" for="little-hero-avatar-file" title="Upload Little Hero avatar">
          <span class="little-hero-avatar-preview" id="little-hero-avatar-preview">
            <img id="little-hero-avatar-image" alt="Little Hero avatar preview">
            <span class="little-hero-avatar-placeholder">LH</span>
          </span>
          <span class="little-hero-upload-label">Upload Avatar</span>
        </label>
        <input id="little-hero-avatar-file" type="file" accept="image/png,image/jpeg,image/webp">

        <div class="little-hero-frame-controls">
          <label class="form-label" for="little-hero-frame-hex">Frame Hex</label>
          <div class="little-hero-frame-row">
            <input id="little-hero-frame-picker" type="color" value="#9B5DE0" aria-label="Avatar frame color">
            <input id="little-hero-frame-hex" type="text" value="#9B5DE0" maxlength="7" spellcheck="false" autocomplete="off">
          </div>
          <div class="little-hero-chaos-note">Structure is controlled. Color is chaos.</div>
        </div>
      </div>

      <button type="submit" class="join-btn" id="join-btn">ENTER BATTLEFIELD</button>
      <div class="error-message" id="error-message"></div>
    </form>
  </div>

  <div id="game-screen">
    <div id="player-battle-layout" class="player-battle-layout">
    <div id="board-layer">
      <div class="timer-tracker" id="timer-tracker-player"></div>
      <div class="womf-tracker" id="womf-tracker-player"></div>
      <!-- Title/theme/difficulty badge live OUTSIDE the sacred 1900x1267
           board frame -- see .public-board-frame's comment below.
           Populated by PlayerApp.renderBoard(). -->
      <div class="public-header" id="public-header-bar"></div>
      <div id="public-board-frame" class="public-board-frame">
        <div class="public-board-ratio">
          <img id="background-layer" alt="Game background">
          <div id="public-board" class="public-board"></div>
        </div>
      </div>
    </div>

    <!-- Read-only Wheel of Misfortune -- no ROLL/CLOSE controls are ever
         drawn here (Wheel.update is always called with isGM=false), it
         only reflects whatever the GM's copy is doing. -->
    <div id="wheel-overlay" class="wheel-overlay"></div>

    <aside id="battle-comms-lobby" class="battle-comms-lobby">
    <div id="player-leaderboard-strip" class="player-leaderboard-strip" style="display: none;">
      <div id="player-leaderboard-list" class="player-leaderboard-list"></div>
      <button type="button" id="player-alltime-toggle-btn" class="player-alltime-toggle-btn">ALL-TIME</button>
    </div>
    <div id="player-alltime-panel" class="player-alltime-panel" style="display: none;"></div>

    <div id="little-hero-hud" class="little-hero-hud">
      <div id="hero-hud-identity" class="hero-hud-identity"></div>
      <div class="hero-hud-stats">
        <span>SCORE <b id="hero-hud-score">0</b></span>
        <span>RANK <b id="hero-hud-rank">#-</b></span>
        <span>STREAK <b id="hero-hud-streak">x0</b></span>
        <span id="hero-hud-link" class="hero-hud-link">LINK CONNECTING</span>
      </div>
    </div>
    <div id="little-hero-roster" class="little-hero-roster"></div>

    <div id="chat-panel">
      <div class="chat-header">
        <div class="battle-comms-heading">
          <span class="chat-title">BATTLE COMMS</span>
          <span class="battle-comms-room" id="battle-comms-room">ROOM ----</span>
        </div>
        <div class="battle-comms-status">
          <span class="battle-comms-online" id="battle-comms-online">● 0 LITTLE HEROES CONNECTED</span>
          <span class="chat-solved" id="chat-solved-count">SOLVED: 0/5</span>
        </div>
      </div>
      <div id="battle-event-feed" class="battle-event-feed"></div>
      <div id="chat-messages"></div>
      <form class="chat-form" id="chat-form">
        <div id="chat-reply-preview" class="chat-reply-preview" style="display:none"></div>
        <input type="text" id="chat-input" placeholder="Transmit to Battle Comms..." maxlength="100" autocomplete="off">
        <button type="submit" class="chat-send-btn">TRANSMIT</button>
      </form>
    </div>
    </aside>
    </div>
    <div class="connection-status" id="connection-status">
      <span class="status-dot"></span>
      <span class="status-text">CONNECTING</span>
    </div>
    <div class="reconnecting" id="reconnecting-overlay">
      <div class="loading-spinner"></div>
      <div>RECONNECTING</div>
    </div>
  </div>

  <div id="score-announcement-layer"></div>

  <script src="js/skeleton.js"></script>
  <script src="js/womf.js"></script>
  <script src="js/wheel.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/game-data.js"></script>
  <script src="js/board.js"></script>
  <script src="js/player.js"></script>
</body>
</html>
