name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Browser-level tests (desktop layout baseline, mobile shell) drive a
      # real Chromium through Playwright's pinned build.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Syntax check server and client scripts
        run: |
          for f in *.js js/*.js gm-modules/*.js scripts/*.js tests/*.js; do
            node --check "$f" || exit 1
          done

      - name: Enforce focused changes with regression coverage
        if: github.event_name == 'pull_request'
        run: node scripts/check-change-scope.js "${{ github.event.pull_request.base.sha }}"

      # Runs every tests/*.js file and reports all failures (scripts/run-all-tests.js).
      - name: Run the complete test suite
        run: npm test
